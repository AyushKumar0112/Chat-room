<!doctype html>
<html>
  <head>
    <!-- 1. Character Encoding -->
    <meta charset="UTF 8" />

    <!-- 2. Responsive viewport Meta Tag-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Room</title>

    <!-- 3. Google Fonts Preconnect (Improves Loading Performace)-->
    <link rel="Preconnect" href="https://fonts.googleapis.com" />
    <link rel="Preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- 4. Font Awesome CDN (Free Icons)-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <!-- 5. Your Custom CSS File-->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="login_screen">
      <div class="login">
        <h1 class="heading">Login Page</h1>
        <input type="text" class="username" placeholder="Username" />
        <div class="avatar_img">
          <input
            type="file"
            class="avatar-file-input"
            accept="image/*"
            placeholder="Upload your local media"
          />
          <input
            type="text"
            class="avatar-url-input"
            placeholder="Upload your avatar from web"
          />
        </div>
        <button class="join">Join</button>
      </div>
    </div>
    <div class="interface">
      <header>
        <div class="user">
          <img class="avatar" src="avatar.jpeg" />
          <nav class="avatar_name">Anime</nav>
        </div>
        <div class="contact">
          <i class="fa-solid fa-phone"></i>
          <i class="fa-solid fa-camera"></i>
        </div>
      </header>
      <div class="chat_message">
        <!-- Chat bubbles will get injected here dynamically -->
      </div>
      <footer>
        <div class="input">
          <div class="camera"><i class="fa-solid fa-camera"></i></div>
          <div classs="message">
            <textarea placeholder="Message"></textarea>
          </div>
        </div>
        <div class="mic">
          <button class="send"><i class="fa-solid fa-paper-plane"></i></button>
          <div class="mic_icon">
            <i class="fa-solid fa-microphone"></i>
          </div>
        </div>
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
